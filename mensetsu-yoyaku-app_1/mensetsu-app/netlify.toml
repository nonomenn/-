# Netlify 設定
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# フロントから /api/xxx で関数を呼べるようにする
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA フォールバック（予約ページのルーティング用）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
